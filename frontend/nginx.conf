server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip para assets estáticos
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Healthcheck do Docker — responde sem tocar no filesystem nem no
    # try_files do SPA. access_log off evita poluir os logs, já que o
    # Docker consulta esta rota a cada poucos segundos.
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Cache longo só para o que o Vite gera com hash no nome (/assets/...).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Arquivos de public/ (logos, favicon) não têm hash: cache curto, senão
    # uma troca de logo levaria até 1 ano para chegar aos navegadores.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # O index.html nunca fica em cache: depois de um deploy ele aponta para
    # assets com hash novo. Se o navegador usasse a versão antiga, ela pediria
    # assets que não existem mais e a tela ficaria travada em "Carregando…".
    # Os assets com hash continuam com cache longo (bloco acima).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Todas as rotas redirecionam para o index.html (SPA client-side routing)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Desabilita acesso a arquivos ocultos
    location ~ /\. {
        deny all;
    }
}
