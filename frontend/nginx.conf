server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Healthcheck do Docker — responde sem tocar no filesystem nem no
    # try_files do SPA. access_log off evita poluir os logs, já que o
    # Docker consulta esta rota a cada poucos segundos.
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Cache longo para assets com hash (gerados pelo Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # O index.html nunca fica em cache: depois de um deploy ele aponta para
    # assets com hash novo. Se o navegador usasse a versão antiga, ela pediria
    # assets que não existem mais e a tela ficaria travada em "Carregando…".
    # Os assets com hash continuam com cache longo (bloco acima).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Todas as rotas redirecionam para o index.html (SPA client-side routing)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Desabilita acesso a arquivos ocultos
    location ~ /\. {
        deny all;
    }
}
