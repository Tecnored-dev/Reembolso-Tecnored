# ===========================================================================
# Dependabot — Atualizações automáticas de dependências
#
# O Dependabot monitora as dependências do projeto e abre Pull Requests
# automáticos quando novas versões são lançadas.
#
# Os PRs são abertos contra a branch "hml" — seguindo o fluxo normal
# de promoção de ambiente: hml → validação → main.
# Isso garante que atualizações sejam validadas antes de chegar em produção.
#
# Cada PR passa pelo CI (.github/workflows/ci.yml: lint, testes e build) —
# o Admin avalia e decide se aprova ou rejeita, como qualquer outro PR.
#
# Para não acumular dezenas de PRs: em pip e npm as atualizações minor/patch
# vêm juntas num PR só por mês (um deploy em hml em vez de vários). Versões
# major continuam em PRs separados, porque podem quebrar e merecem teste à
# parte. Alertas de segurança não esperam o mês: chegam na hora, separados.
#
# Documentação: https://docs.github.com/en/code-security/dependabot
# ===========================================================================

version: 2
updates:

  # -------------------------------------------------------------------------
  # Python — pacotes do backend/requirements.txt (FastAPI)
  # minor/patch num PR mensal agrupado; major em PR separado
  # -------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/backend"           # pasta onde está o requirements.txt
    target-branch: "hml"         # PR aberto contra hml, não main
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5     # máximo de PRs abertos simultaneamente
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"              # título/commit vira "chore: bump X from A to B" — seção 13 do README
    labels:
      - "chore"
      - "dependabot"

  # -------------------------------------------------------------------------
  # npm — pacotes do frontend/package.json (React + Vite)
  # minor/patch num PR mensal agrupado; major em PR separado
  # -------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/frontend"          # pasta onde está o package.json
    target-branch: "hml"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # React 19 é migração à parte: react, react-dom e @types sobem juntos.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
    labels:
      - "chore"
      - "dependabot"

  # -------------------------------------------------------------------------
  # Docker — imagem base do Dockerfile do backend (python:3.12-slim)
  # Monitora a linha FROM e abre PR quando há nova versão da imagem
  # Imagens mudam com menos frequência — verificação mensal é suficiente
  # -------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/backend"           # pasta onde está o Dockerfile
    target-branch: "hml"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    labels:
      - "chore"
      - "dependabot"

  # -------------------------------------------------------------------------
  # Docker — imagens base do Dockerfile do frontend (node:22-alpine, nginx:alpine)
  # -------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/frontend"          # pasta onde está o Dockerfile
    target-branch: "hml"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    labels:
      - "chore"
      - "dependabot"

  # -------------------------------------------------------------------------
  # GitHub Actions — versões das actions usadas nos workflows
  # ex: actions/checkout@v4 → abre PR quando sair v5
  # -------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"                  # sempre raiz do repositório
    target-branch: "hml"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    labels:
      - "chore"
      - "dependabot"