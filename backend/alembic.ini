[alembic]
script_location = migrations
# Permite "import app" no env.py quando o comando roda de backend/ (e de /app no container).
prepend_sys_path = .
# A URL vem de DB_URL (migrations/env.py) — nunca coloque senha aqui.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
